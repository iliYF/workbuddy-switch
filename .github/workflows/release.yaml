name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platform:
        description: "选择要构建的平台。macOS Universal = Apple Silicon + Intel x64 两架构并行;win-x64 只出测试安装包,不发 Release。"
        type: choice
        default: all
        options:
          - all
          - macOS Universal
          - macOS Apple Silicon
          - macOS Intel x64
          - linux-x64
          - win-x64

permissions:
  contents: write

jobs:
  resolve-platforms:
    name: Resolve Platforms
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: set
        env:
          EVENT_NAME: ${{ github.event_name }}
          PLATFORM: ${{ inputs.platform }}
        run: python3 scripts/resolve-platforms.py

  build:
    name: Build ${{ matrix.name }} Artifacts
    needs: resolve-platforms
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-platforms.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # ── 环境准备 ────────────────────────────────────────────────

      # 构建前应用 fork 身份补丁(identifier/pubkey/endpoints/GITHUB_OWNER)。
      # 只改临时工作区,不落库;上游文件保持逐字节一致,可无缝同步。
      - name: Apply fork identity patch
        shell: bash
        run: bash scripts/apply-patch.sh

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      # cargo 缓存：依赖 + 编译产物，增量编译大幅提速（Cargo.lock 不变时命中）
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # dmgbuild writes Finder metadata without opening Finder, so DMGs keep
      # their large icons and drag arrow in headless macOS runners.
      - name: Set up Python for dmgbuild
        if: runner.os == 'macOS'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dmgbuild (macOS only)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          DMGBUILD_VENV="$RUNNER_TEMP/dmgbuild-venv"
          python3 -m venv "$DMGBUILD_VENV"
          "$DMGBUILD_VENV/bin/python" -m pip install --disable-pip-version-check --no-input \
            "dmgbuild==1.6.5"
          echo "$DMGBUILD_VENV/bin" >> "$GITHUB_PATH"

      # ── 构建 ────────────────────────────────────────────────────

      # 前端构建产物（CLI 二进制 rust-embed 嵌入 + Tauri App 使用）
      - name: Build frontend
        run: |
          npm install
          npm run build

      # CLI 二进制
      - name: Build server binary
        shell: bash
        run: |
          cargo build -p wb-switch-server --release --target ${{ matrix.target }}
          mkdir -p dist-bin

      # 桌面 App（mac app / nsis exe / deb + AppImage）；逻辑见 scripts/build-desktop-app.sh
      # 注:所有平台都跑此步;脚本内部按 bundles 分支(仅 app 打 dmg,nsis 校验 .exe)。
      - name: Build desktop app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          bash scripts/build-desktop-app.sh "${{ matrix.target }}" "${{ matrix.bundles }}" "${{ matrix.update_arch }}" "${{ matrix.installer_names }}"

      # updater 版本清单（签名包收集 + gen-update-json）；逻辑见 scripts/gen-manifest.sh
      # 仅 mac/windows 需要;linux 的 update_arch 为空则跳过。
      - name: Generate updater manifest
        if: matrix.update_arch != ''
        shell: bash
        run: |
          bash scripts/gen-manifest.sh \
            "${{ matrix.target }}" "${{ matrix.update_os }}" "${{ matrix.update_arch }}" \
            "${{ matrix.update_archive_name }}" "${{ matrix.update_bundle }}"

      # ── 产物收集 ────────────────────────────────────────────────

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}
          path: dist-bin/
          if-no-files-found: error

  release:
    name: Publish Release Assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Merge updater manifests
        run: python3 scripts/merge-update-manifests.py artifacts

      # 重建 release,避免 softprops 只追加上传导致旧命名资产残留(同 tag 重跑也不冲突)。
      - name: Reset Release Assets
        run: gh release delete "${{ github.ref_name }}" --yes || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
