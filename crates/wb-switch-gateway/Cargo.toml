[package]
name = "wb-switch-gateway"
version = "0.1.40"
edition = "2021"
description = "wb-switch 网关管理(对接 workbuddy2api:托管/同步/模型中心/配置),独立 crate,不依赖 Tauri"

[dependencies]
wb-switch-core = { path = "../wb-switch-core" }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
